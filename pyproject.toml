[project]
name = "axile"
version = "0.22.0"
description = "通过 Web UI 配置和运行的多渠道交易执行服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10.11",
    "zstandard>=0.23,<1",
    "apscheduler>=3.11.0",
    "croniter>=5.0.0",
    "fastapi[standard]>=0.115.12",
    "loguru>=0.7.3",
    "numpy==2.3.2",
    "pandas>=2.2.3",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.1.0",
    "shinny-calendar>=1.0.2026,<2",
    "streamlit>=1.41.0",
    "typer>=0.20.1",
    "tomlkit>=0.15.0",
    "ty>=0.0.83,<0.1",
    "ruff>=0.11,<1",
]


[project.optional-dependencies]
# CTP交易所版本依赖
ctp = ["openctp-ctp==6.7.11.*"]
gm = ["gm>=3.0.183; sys_platform != 'darwin'"]
tqsdk = ["tqsdk>=3.10.2,<3.11"]
all = ["axile[ctp]", "axile[gm]", "axile[tqsdk]"]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "alembic>=1.15.2",
    "greenlet>=3.3.0",
    "sqlalchemy>=2.0.46",
    "sqlmodel>=0.0.24",
    "basedpyright>=1.29.1",
    "commitizen>=4.11.1",
    "hatchling>=1.27.0",
    "ipython>=9.4.0",
    "jupyter>=1.1.1",
    "pandas-stubs>=2.3.3.251201",
    "pre-commit>=4.2.0",
    "psutil>=7.0.0",
    "pytest>=8.4.1",
    "pytest-cov>=7.0.0",
    "requests>=2.32.3",
    "ruff>=0.11.0",
]

[project.scripts]
axile = "axile.cli.main:main"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
shinny-calendar = { index = "pypi" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "axile/server/_static/**",
]

[tool.hatch.build.targets.wheel]
artifacts = [
    "axile/server/_static/**",
    "axile/server/_native/axile-analysis",
    "axile/server/_native/axile-analysis.exe",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
pre_bump_hooks = ["uv lock", "git add -- uv.lock"]
tag_format = "v$version"
major_version_zero = true

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["D", "E", "F", "I", "W"]
ignore = ["D400", "E203", "E501"]
task-tags = ["TODO", "FIXME", "HACK", "NOTE", "SAFETY", "PERF", "COMPAT"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "E402"]
"stubs/openctp_ctp/*.pyi" = ["D"]
"axile/server/execution/factory.py" = ["E402"]


[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["axile"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
stubPath = "stubs"
venvPath = "."
venv = ".venv"
include = [
    "axile/common",
    "axile/executor/algorithms",
    "axile/executor/models",
    "axile/server/api",
    "axile/server/app.py",
    "axile/server/core",
    "axile/server/execution_audit.py",
]
exclude = [
    ".venv",
    ".git",
]

[tool.coverage.run]
branch = true
source = ["axile"]

[tool.coverage.report]
fail_under = 69
show_missing = true
