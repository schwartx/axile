<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="100%" height="100%">
  <defs>
    <style>
      .bg-card { fill: #1c1917; stroke: #44403c; stroke-width: 1.2px; rx: 8px; }
      .bg-engine { fill: #292524; stroke: #d97706; stroke-width: 1.5px; rx: 8px; }
      .bg-channel { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.2px; rx: 6px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 14px; font-weight: 600; fill: #f5f5f4; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 11.5px; fill: #a8a29e; }
      .text-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 11px; fill: #fbbf24; font-weight: 500; }
      .text-channel { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; fill: #7dd3fc; }
      .line-main { fill: none; stroke: #d97706; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; }
      .line-side { fill: none; stroke: #78716c; stroke-width: 1.2px; stroke-dasharray: 4 3; }
      .line-channel { fill: none; stroke: #38bdf8; stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 1. 输入层：策略组合权重 -->
  <g transform="translate(30, 40)">
    <rect class="bg-card" x="0" y="0" width="180" height="70"/>
    <text class="text-title" x="90" y="28" text-anchor="middle">Portfolio Target</text>
    <text class="text-sub" x="90" y="48" text-anchor="middle">目标组合权重 (0.0 ~ 1.0)</text>
  </g>

  <!-- 连接 1 -> 2 -->
  <path class="line-main" d="M 210 75 L 260 75" marker-end="url(#arr-amber)"/>

  <!-- 2. Sizing 引擎 -->
  <g transform="translate(268, 30)">
    <rect class="bg-card" x="0" y="0" width="230" height="90"/>
    <text class="text-title" x="115" y="28" text-anchor="middle">Target Sizing Engine</text>
    <text class="text-sub" x="115" y="48" text-anchor="middle">动态换算可执行真实手数</text>
    <line x1="15" y1="58" x2="215" y2="58" stroke="#44403c" stroke-width="0.8"/>
    <text class="text-badge" x="115" y="74" text-anchor="middle">实时净资产 × 合约乘数 × 保证金率</text>
  </g>

  <!-- 连接 2 -> 3 -->
  <path class="line-main" d="M 498 75 L 548 75" marker-end="url(#arr-amber)"/>

  <!-- 3. 执行引擎核心 (Execution Engine) -->
  <g transform="translate(556, 25)">
    <rect class="bg-engine" x="0" y="0" width="290" height="100"/>
    <text class="text-title" x="145" y="26" text-anchor="middle" style="fill:#fbbf24;">Execution Engine</text>
    <text class="text-sub" x="145" y="46" text-anchor="middle">单一契约状态机与开平守卫</text>
    
    <g transform="translate(16, 58)">
      <rect x="0" y="0" width="124" height="26" rx="4" fill="#451a03" stroke="#b45309" stroke-width="0.8"/>
      <text class="text-sub" x="62" y="17" text-anchor="middle" style="fill:#fde68a;">未知持仓安全阻断</text>
      
      <rect x="134" y="0" width="124" height="26" rx="4" fill="#1c1917" stroke="#57534e" stroke-width="0.8"/>
      <text class="text-sub" x="196" y="17" text-anchor="middle" style="fill:#e7e5e4;">平今/平昨智能分流</text>
    </g>
  </g>

  <!-- 算法路由向下展开 -->
  <path class="line-main" d="M 701 125 L 701 165" marker-end="url(#arr-amber)"/>

  <!-- 4. 路由算法层 -->
  <g transform="translate(268, 170)">
    <rect class="bg-card" x="0" y="0" width="578" height="64"/>
    <text class="text-title" x="90" y="24" text-anchor="middle">Execution Algorithms</text>
    <text class="text-sub" x="90" y="44" text-anchor="middle">拆单与盘口执行算法</text>
    
    <line x1="175" y1="12" x2="175" y2="52" stroke="#44403c" stroke-width="1"/>
    
    <!-- 4个算法药丸 -->
    <g transform="translate(195, 18)">
      <rect x="0" y="0" width="85" height="28" rx="4" fill="#292524" stroke="#57534e" stroke-width="1"/>
      <text class="text-title" x="42" y="18" text-anchor="middle" style="font-size:12px;">SingleMaker</text>
      
      <rect x="95" y="0" width="75" height="28" rx="4" fill="#292524" stroke="#57534e" stroke-width="1"/>
      <text class="text-title" x="132" y="18" text-anchor="middle" style="font-size:12px;">TWAP</text>
      
      <rect x="180" y="0" width="75" height="28" rx="4" fill="#292524" stroke="#57534e" stroke-width="1"/>
      <text class="text-title" x="217" y="18" text-anchor="middle" style="font-size:12px;">POV</text>

      <rect x="265" y="0" width="105" height="28" rx="4" fill="#292524" stroke="#57534e" stroke-width="1"/>
      <text class="text-title" x="317" y="18" text-anchor="middle" style="font-size:12px;">Limit / Chase</text>
    </g>
  </g>

  <!-- 连接算法层到渠道总线 -->
  <path class="line-channel" d="M 557 234 L 557 265"/>

  <!-- 渠道总线横轴 -->
  <line x1="120" y1="265" x2="560" y2="265" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- 5. 渠道适配层 (Channel Adapters) -->
  <g transform="translate(30, 280)">
    <!-- CTP -->
    <path class="line-channel" d="M 90 -15 L 90 0" marker-end="url(#arr-blue)"/>
    <rect class="bg-channel" x="0" y="0" width="180" height="60"/>
    <text class="text-channel" x="90" y="26" text-anchor="middle">OpenCTP / CTP</text>
    <text class="text-sub" x="90" y="44" text-anchor="middle" style="fill:#94a3b8;">国内期货 / 上期平今分流</text>

    <!-- 天勤 TQ -->
    <path class="line-channel" d="M 310 -15 L 310 0" marker-end="url(#arr-blue)"/>
    <g transform="translate(220, 0)">
      <rect class="bg-channel" x="0" y="0" width="180" height="60"/>
      <text class="text-channel" x="90" y="26" text-anchor="middle">TqSdk (天勤)</text>
      <text class="text-sub" x="90" y="44" text-anchor="middle" style="fill:#94a3b8;">实盘 / 快期模拟 / 本地沙箱</text>
    </g>

    <!-- 掘金 GM -->
    <path class="line-channel" d="M 530 -15 L 530 0" marker-end="url(#arr-blue)"/>
    <g transform="translate(440, 0)">
      <rect class="bg-channel" x="0" y="0" width="180" height="60"/>
      <text class="text-channel" x="90" y="26" text-anchor="middle">GoldMiner (掘金)</text>
      <text class="text-sub" x="90" y="44" text-anchor="middle" style="fill:#94a3b8;">A股 / 多品种跨市覆盖</text>
    </g>

  </g>
</svg>
