<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>axile</title>
    <script>
      // 首屏定主题，避免深浅闪烁（FOUC）。与 stores/theme.ts 的 key 一致。
      (function () {
        try {
          var m = localStorage.getItem('axile-theme') || 'system'
          var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
      // 独立恢复无障碍偏好；校验与 stores/accessibility.ts 保持一致。
      ;(function () {
        var value = null
        try {
          var raw = localStorage.getItem('axile-accessibility')
          localStorage.setItem('axile-accessibility-probe', '1')
          localStorage.removeItem('axile-accessibility-probe')
          try { value = JSON.parse(raw || 'null') } catch (e) {}
        } catch (e) {}
        var stored = value && typeof value === 'object' ? value : {}
        var root = document.documentElement.classList
        root.toggle('contrast-more', stored.enhancedContrast === true)
        root.toggle('market-green-up', stored.marketPalette === 'green-up')
        root.toggle('market-purple-up', stored.marketPalette === 'purple-up')
        root.toggle('market-blue-up', stored.marketPalette === 'blue-up')
        root.toggle('market-red-cyan', stored.marketPalette === 'red-cyan')
        root.toggle('market-monochrome', stored.marketPalette === 'monochrome')
        root.toggle('direction-markers', stored.directionMarkers === true || stored.marketPalette === 'monochrome')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
