[package]
name = "axile-browser"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
# Shared calculation unit tests run in storage; this crate tests the browser store end to end.
test = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
rusqlite = { version = "=0.41.0", features = ["functions", "fallible_uint"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = { version = "=0.41.0", features = ["ffi-sqlite-wasm-rs"] }
sqlite-wasm-rs = { version = "=0.6.2", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "=0.3.0", features = ["sahpool"] }
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
wasm-bindgen-futures = "=0.4.78"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "=0.41.0", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
