[package]
name = "axile-replay-heat"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axile-analysis-core = { path = "../analysis-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.128"

[profile.release]
lto = true
