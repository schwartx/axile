[package]
name = "axile-replay-heat"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
raw-only = ["dep:flate2", "serde_json/float_roundtrip"]

[dependencies]
axile-analysis-core = { path = "../analysis-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
wasm-bindgen = "=0.2.128"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"], optional = true }

[profile.release]
lto = true
