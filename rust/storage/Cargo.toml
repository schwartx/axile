[package]
name = "axile-storage"
version = "0.1.0"
edition = "2021"
publish = false
description = "SQLite storage and analytics for Axile"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
axile-analysis-core = { path = "../analysis-core" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
libc = "0.2"
fs2 = "0.4"
tempfile = "3"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
mcap = { version = "=0.26.0", default-features = false, features = ["zstd"] }
pyo3 = { version = "0.29.3", features = ["abi3-py312", "extension-module"], optional = true }
rusqlite = { version = "0.31", features = ["bundled", "functions", "backup", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
simdutf8 = "=0.1.5"
regex = "1"
uuid = { version = "=1.11.0", default-features = false, features = ["std", "v4", "v5"] }
zstd = "0.14.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
