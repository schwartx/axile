[package]
name = "axile-storage"
version = "0.1.0"
edition = "2021"
publish = false
description = "SQLite storage and analytics for Axile"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
pyo3 = { version = "0.29.3", features = ["abi3-py312", "extension-module"], optional = true }
rusqlite = { version = "0.31", features = ["bundled", "functions", "backup", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
serde_path_to_error = "0.1"
schemars = "1"
sha2 = "0.10"
regex = "1"
uuid = { version = "=1.11.0", default-features = false, features = ["std", "v5"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
