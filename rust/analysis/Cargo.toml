[package]
name = "axile-analysis"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "Bounded SQLite analysis and publication worker for Axile"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
pyo3 = { version = "0.29.3", features = ["abi3-py312", "extension-module"], optional = true }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
