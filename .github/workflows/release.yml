name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/axile
    permissions:
      contents: read
      actions: read
      id-token: write # PyPI Trusted Publishing (OIDC)，无需 PYPI_API_TOKEN

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Reuse artifacts from the exact successful quality run
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        QUALITY_RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow code-quality.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId,status,conclusion --jq '.[0] | select(.status == "completed" and .conclusion == "success") | .databaseId')
        if [ -z "$QUALITY_RUN_ID" ]; then
          echo "::error::No successful Code Quality push run for $GITHUB_SHA"
          exit 1
        fi
        gh run download "$QUALITY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name axile-native-core --dir axile/server/_native
        gh run download "$QUALITY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name axile-web-ui --dir axile/server/_static

    - name: Verify tag matches project version
      if: github.event_name == 'push'
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "tag: ${TAG_VERSION}, pyproject: ${PROJECT_VERSION}"
        if [ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]; then
          echo "::error::tag 版本 (${GITHUB_REF_NAME}) 与 pyproject.toml 版本 (${PROJECT_VERSION}) 不一致"
          exit 1
        fi

    - name: Build distributions
      run: |
        # The validated native extension belongs to this host's platform wheel.
        uv build --wheel

    - name: Audit and repair Linux wheel
      run: uv run --no-project --with auditwheel==6.8.2 --with patchelf auditwheel repair --plat auto --wheel-dir wheelhouse dist/*.whl

    - name: Verify installed wheel in a clean environment
      run: |
        uv venv "$RUNNER_TEMP/axile-release-verify" --python 3.12
        uv pip install --python "$RUNNER_TEMP/axile-release-verify/bin/python" wheelhouse/*.whl
        "$RUNNER_TEMP/axile-release-verify/bin/python" -I scripts/verify_release_install.py
        "$RUNNER_TEMP/axile-release-verify/bin/axile" --help

    - uses: actions/upload-artifact@v4
      with:
        name: axile-release-wheel
        path: wheelhouse/*.whl
        if-no-files-found: error

    - name: Publish to PyPI
      if: github.event_name == 'push'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: wheelhouse/
