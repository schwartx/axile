name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux-x86_64
          container: quay.io/pypa/manylinux_2_28_x86_64@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
        - os: windows-latest
          platform: windows-x86_64
          container: ''
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use manylinux CPython
      if: runner.os == 'Linux'
      run: echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"

    - name: Set up Python
      if: runner.os == 'Windows'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: x64

    - uses: astral-sh/setup-uv@v6

    - name: Find the exact successful quality run
      id: quality
      uses: actions/github-script@v7
      with:
        script: |
          const { data } = await github.rest.actions.listWorkflowRuns({
            ...context.repo, workflow_id: 'code-quality.yml', head_sha: context.sha,
            event: 'push', per_page: 1,
          });
          const run = data.workflow_runs[0];
          if (!run || run.head_sha !== context.sha || run.status !== 'completed' || run.conclusion !== 'success') {
            throw new Error(`No successful Code Quality push run for ${context.sha}`);
          }
          core.setOutput('run-id', run.id);

    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: ${{ steps.quality.outputs.run-id }}
        name: axile-native-core-${{ matrix.platform }}
        path: axile/server/_native

    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: ${{ steps.quality.outputs.run-id }}
        name: axile-web-ui
        path: axile/server/_static

    - name: Verify tag matches project version
      if: github.event_name == 'push'
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "tag: ${TAG_VERSION}, pyproject: ${PROJECT_VERSION}"
        if [ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]; then
          echo "::error::tag 版本 (${GITHUB_REF_NAME}) 与 pyproject.toml 版本 (${PROJECT_VERSION}) 不一致"
          exit 1
        fi

    - name: Build distributions
      run: uv build --wheel

    - name: Audit and repair Linux wheel
      if: runner.os == 'Linux'
      run: uv run --no-project --with auditwheel==6.8.2 --with patchelf auditwheel repair --plat manylinux_2_28_x86_64 --wheel-dir wheelhouse dist/*.whl

    - name: Audit and repair Windows wheel
      if: runner.os == 'Windows'
      run: uv run --no-project --with delvewheel==1.11.2 delvewheel repair --wheel-dir wheelhouse dist/*.whl

    - name: Verify installed wheel in a clean environment
      run: |
        uv venv "$RUNNER_TEMP/axile-release-verify" --python 3.12
        if [ "$RUNNER_OS" = "Windows" ]; then
          VERIFY_BIN="$RUNNER_TEMP/axile-release-verify/Scripts"
          PYTHON="$VERIFY_BIN/python.exe"
          AXILE="$VERIFY_BIN/axile.exe"
        else
          VERIFY_BIN="$RUNNER_TEMP/axile-release-verify/bin"
          PYTHON="$VERIFY_BIN/python"
          AXILE="$VERIFY_BIN/axile"
        fi
        uv pip install --python "$PYTHON" wheelhouse/*.whl
        "$PYTHON" -I scripts/verify_release_install.py
        "$AXILE" --help

    - uses: actions/upload-artifact@v4
      with:
        name: axile-release-wheel-${{ matrix.platform }}
        path: wheelhouse/*.whl
        if-no-files-found: error

  release:
    needs: wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/axile
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC)，无需 PYPI_API_TOKEN
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: axile-release-wheel-*
        merge-multiple: true
        path: wheelhouse

    - name: Require both platform wheels before publishing
      run: |
        python - <<'PY'
        from pathlib import Path
        wheels = list(Path('wheelhouse').glob('*.whl'))
        assert len(wheels) == 2, wheels
        assert sum('manylinux_2_28_x86_64' in wheel.name and wheel.name.endswith('_x86_64.whl') for wheel in wheels) == 1, wheels
        assert sum(wheel.name.endswith('-win_amd64.whl') for wheel in wheels) == 1, wheels
        PY

    - name: Publish to PyPI
      if: github.event_name == 'push'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: wheelhouse/
