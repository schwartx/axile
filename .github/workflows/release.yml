name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux-x86_64
        - os: windows-latest
          platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: x64

    - uses: astral-sh/setup-uv@v6

    - name: Reuse artifacts from the exact successful quality run
      env:
        GH_TOKEN: ${{ github.token }}
        NATIVE_ARTIFACT: axile-native-core-${{ matrix.platform }}
      run: |
        QUALITY_RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow code-quality.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId,status,conclusion --jq '.[0] | select(.status == "completed" and .conclusion == "success") | .databaseId')
        if [ -z "$QUALITY_RUN_ID" ]; then
          echo "::error::No successful Code Quality push run for $GITHUB_SHA"
          exit 1
        fi
        gh run download "$QUALITY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$NATIVE_ARTIFACT" --dir axile/server/_native
        gh run download "$QUALITY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name axile-web-ui --dir axile/server/_static

    - name: Verify tag matches project version
      if: github.event_name == 'push'
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "tag: ${TAG_VERSION}, pyproject: ${PROJECT_VERSION}"
        if [ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]; then
          echo "::error::tag 版本 (${GITHUB_REF_NAME}) 与 pyproject.toml 版本 (${PROJECT_VERSION}) 不一致"
          exit 1
        fi

    - name: Build distributions
      run: uv build --wheel

    - name: Audit and repair Linux wheel
      if: runner.os == 'Linux'
      run: uv run --no-project --with auditwheel==6.8.2 --with patchelf auditwheel repair --plat auto --wheel-dir wheelhouse dist/*.whl

    - name: Audit and repair Windows wheel
      if: runner.os == 'Windows'
      run: uv run --no-project --with delvewheel==1.11.2 delvewheel repair --wheel-dir wheelhouse dist/*.whl

    - name: Verify installed wheel in a clean environment
      run: |
        uv venv "$RUNNER_TEMP/axile-release-verify" --python 3.12
        if [ "$RUNNER_OS" = "Windows" ]; then
          VERIFY_BIN="$RUNNER_TEMP/axile-release-verify/Scripts"
          PYTHON="$VERIFY_BIN/python.exe"
          AXILE="$VERIFY_BIN/axile.exe"
        else
          VERIFY_BIN="$RUNNER_TEMP/axile-release-verify/bin"
          PYTHON="$VERIFY_BIN/python"
          AXILE="$VERIFY_BIN/axile"
        fi
        uv pip install --python "$PYTHON" wheelhouse/*.whl
        "$PYTHON" -I scripts/verify_release_install.py
        "$AXILE" --help

    - uses: actions/upload-artifact@v4
      with:
        name: axile-release-wheel-${{ matrix.platform }}
        path: wheelhouse/*.whl
        if-no-files-found: error

  release:
    needs: wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/axile
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC)，无需 PYPI_API_TOKEN
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: axile-release-wheel-*
        merge-multiple: true
        path: wheelhouse

    - name: Require both platform wheels before publishing
      run: |
        python - <<'PY'
        from pathlib import Path
        wheels = list(Path('wheelhouse').glob('*.whl'))
        assert len(wheels) == 2, wheels
        assert sum('manylinux' in wheel.name and wheel.name.endswith('_x86_64.whl') for wheel in wheels) == 1, wheels
        assert sum(wheel.name.endswith('-win_amd64.whl') for wheel in wheels) == 1, wheels
        PY

    - name: Publish to PyPI
      if: github.event_name == 'push'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: wheelhouse/
