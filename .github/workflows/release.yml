name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
    environment:
      name: pypi
      url: https://pypi.org/p/axile
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC)，无需 PYPI_API_TOKEN

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - uses: dtolnay/rust-toolchain@stable
    - name: Build native extension
      run: |
        export CARGO_TARGET_DIR="$RUNNER_TEMP/axile-analysis-target"
        echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
        cargo build --manifest-path rust/analysis/Cargo.toml --release --locked --lib --features python
    - name: Stage and verify native extension
      run: uv run --no-project --with hatchling --with packaging python scripts/build_native_analysis.py --no-build --target-dir "$CARGO_TARGET_DIR"
    - name: Run Rust unit tests
      run: cargo test --manifest-path rust/analysis/Cargo.toml --locked --lib

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.0'

    - name: Verify tag matches project version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "tag: ${TAG_VERSION}, pyproject: ${PROJECT_VERSION}"
        if [ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]; then
          echo "::error::tag 版本 (${GITHUB_REF_NAME}) 与 pyproject.toml 版本 (${PROJECT_VERSION}) 不一致"
          exit 1
        fi

    - name: Build Web UI
      working-directory: ui
      run: |
        bun install --frozen-lockfile
        bun run build

    - name: Build distributions
      run: |
        # The validated native extension belongs to this host's platform wheel.
        uv build --wheel

    - name: Audit and repair Linux wheel
      run: uv run --no-project --with auditwheel==6.8.2 --with patchelf auditwheel repair --plat auto --wheel-dir wheelhouse dist/*.whl

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: wheelhouse/
