name: Code Quality

permissions:
  contents: read

on:
  push:
    branches: [ main, develop, 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  notification-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --locked --group dev
    - run: uv run pytest tests/unit/common/test_notification_function.py -q

  editor-ui:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - run: uv sync --locked --group dev
    - run: bun install --frozen-lockfile
      working-directory: ui
    - run: bun run lint && bun test && bun run build
      working-directory: ui
    - run: bunx playwright install --with-deps chromium
      working-directory: ui
    - run: bun run test:e2e
      working-directory: ui
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: editor-browser-traces
        path: ui/test-results/
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Sync test dependencies
      run: |
        uv sync --locked --group dev --extra ctp

    - name: Run Ruff formatter check
      run: |
        uv run ruff format --check axile tests
      continue-on-error: false

    - name: Run Ruff lint
      run: |
        uv run ruff check axile tests
      continue-on-error: false

    - name: Run Ruff complexity gate
      run: |
        uv run ruff check axile/executor/algorithms --select C901
      continue-on-error: false

  type-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
      continue-on-error: false

    - name: Sync dev dependencies
      run: |
        uv sync --locked --group dev
      continue-on-error: false

    - name: Run BasedPyright
      run: |
        uv run basedpyright

  test:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: 配置 CTP 所需的中文区域设置
      run: |
        sudo locale-gen zh_CN.GB18030

    - name: Sync test dependencies
      run: |
        uv sync --locked --group dev --extra ctp

    - name: 验证 CTP 原生模块
      run: |
        locale -a | grep -qi '^zh_CN.gb18030$'
        uv run python -c "from openctp_ctp import thostmduserapi, thosttraderapi"

    - name: Run tests
      run: |
        uv run pytest tests/ -v \
          --ignore=tests/live \
          --cov=axile --cov-report=xml --cov-report=term-missing --cov-fail-under=69

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true
