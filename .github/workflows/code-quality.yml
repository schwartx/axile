name: Code Quality

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      ui: ${{ steps.scope.outputs.ui }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - id: scope
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "$EVENT_NAME" = pull_request ]; then
          python scripts/ci_scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
        else
          python scripts/ci_scope.py >> "$GITHUB_OUTPUT"
        fi

  editor-ui:
    needs: scope
    if: needs.scope.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - run: uv sync --locked --group dev
    - run: bun install --frozen-lockfile
      working-directory: ui
    - run: bun run lint && bun test && bun run build
      working-directory: ui
  lint:
    needs: scope
    if: needs.scope.outputs.backend != 'none'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Sync test dependencies
      run: |
        uv sync --locked --group dev --extra ctp

    - name: Run Ruff formatter check
      run: |
        uv run ruff format --check axile tests scripts/ci_scope.py
      continue-on-error: false

    - name: Run Ruff lint
      run: |
        uv run ruff check axile tests scripts/ci_scope.py
      continue-on-error: false

    - name: Run Ruff complexity gate
      run: |
        uv run ruff check axile/executor/algorithms --select C901
      continue-on-error: false

  type-check:
    needs: scope
    if: needs.scope.outputs.backend != 'none'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
      continue-on-error: false

    - name: Sync dev dependencies
      run: |
        uv sync --locked --group dev
      continue-on-error: false

    - name: Run BasedPyright
      run: |
        uv run basedpyright

  test:
    needs: scope
    if: needs.scope.outputs.backend != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: 配置 CTP 所需的中文区域设置
      run: |
        sudo locale-gen zh_CN.GB18030

    - name: Sync test dependencies
      run: |
        uv sync --locked --group dev --extra ctp --extra gm

    - name: 验证 CTP 原生模块
      run: |
        locale -a | grep -qi '^zh_CN.gb18030$'
        uv run python -c "from openctp_ctp import thostmduserapi, thosttraderapi"

    - name: Run full tests and coverage
      if: needs.scope.outputs.backend == 'full'
      run: |
        # Preserve pytest's status even if a native SDK exits during interpreter shutdown.
        uv run python -c 'import os, sys, pytest; code = pytest.main(sys.argv[1:]); sys.stdout.flush(); sys.stderr.flush(); os._exit(int(code))' tests/ -v \
          --ignore=tests/live \
          --cov=axile --cov-report=xml --cov-report=term-missing --cov-fail-under=69

    - name: Run executor PR tests
      if: needs.scope.outputs.backend == 'executor'
      run: |
        uv run python -c 'import os, sys, pytest; code = pytest.main(sys.argv[1:]); sys.stdout.flush(); sys.stderr.flush(); os._exit(int(code))' \
          tests/unit/executor tests/contract tests/integration -q

    - name: Run offline CTP scenario script tests
      run: |
        # Tests block network access and use SDK request substitutes; no broker login.
        uv run python -c 'import os, sys, pytest; code = pytest.main(sys.argv[1:]); sys.stdout.flush(); sys.stderr.flush(); os._exit(int(code))' 飞泰CTP测试/tests -q

    - name: Upload coverage to Codecov
      if: needs.scope.outputs.backend == 'full'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      timeout-minutes: 5
      with:
        use_oidc: true
        fail_ci_if_error: true
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
