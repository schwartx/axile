name: Code Quality

permissions:
  contents: read

on:
  push:
    branches: [ main, develop, next ]
  pull_request:
    branches: [ main, develop, next ]

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - uses: dtolnay/rust-toolchain@1.99.1
    - name: Build native extension
      run: |
        export CARGO_TARGET_DIR="$RUNNER_TEMP/axile-storage-target"
        echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
        cargo build --manifest-path rust/storage/Cargo.toml --release --locked --lib --features python
    - name: Stage and verify native extension
      run: uv run --no-project --with hatchling --with packaging python scripts/build_native_analysis.py --no-build --target-dir "$CARGO_TARGET_DIR"
    - uses: actions/upload-artifact@v4
      with:
        name: axile-native-core
        path: axile/server/_native/_core.abi3.so
        if-no-files-found: error

  editor-ui:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: axile-native-core
        path: axile/server/_native
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - run: uv sync --locked --group dev
    - run: bun install --frozen-lockfile
      working-directory: ui
    - uses: dtolnay/rust-toolchain@1.99.1
      with:
        targets: wasm32-unknown-unknown
    - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
    - run: bun run lint && bun run build
      working-directory: ui
    - uses: actions/upload-artifact@v4
      with:
        name: axile-web-ui
        path: axile/server/_static/
        include-hidden-files: true
        if-no-files-found: error
  lint:
    needs: native
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: axile-native-core
        path: axile/server/_native

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Sync test dependencies
      run: |
        uv sync --locked --group dev --extra ctp

    - name: Run Ruff formatter check
      run: |
        uv run ruff format --check axile tests
      continue-on-error: false

    - name: Run Ruff lint
      run: |
        uv run ruff check axile tests
      continue-on-error: false

    - name: Run Ruff complexity gate
      run: |
        uv run ruff check axile/executor/algorithms --select C901
      continue-on-error: false

  type-check:
    needs: native
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: axile-native-core
        path: axile/server/_native

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
      continue-on-error: false

    - name: Sync dev dependencies
      run: |
        uv sync --locked --group dev
      continue-on-error: false

    - name: Run BasedPyright
      run: |
        uv run basedpyright

  smoke:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: axile-native-core
        path: axile/server/_native
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --locked --group dev
    - name: Check native startup, migrations and public API
      run: timeout 60s uv run pytest tests/contract/test_native_storage_runtime.py -q
