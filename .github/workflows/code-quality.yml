name: Code Quality

permissions:
  contents: read

on:
  push:
    branches: [ main, develop, next ]
  pull_request:
    branches: [ main, develop, next ]

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux-x86_64
          container: quay.io/pypa/manylinux_2_28_x86_64@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
        - os: windows-latest
          platform: windows-x86_64
          container: ''
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@v4
    - name: Use manylinux CPython
      if: runner.os == 'Linux'
      run: echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
    - uses: actions/setup-python@v5
      if: runner.os == 'Windows'
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - uses: dtolnay/rust-toolchain@1.99.1
    - name: Cache native Cargo build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/axile-storage-target
        key: native-manylinux228-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-python-3.12-${{ hashFiles('rust/**/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          native-manylinux228-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-python-3.12-${{ hashFiles('rust/**/Cargo.lock') }}-
    - name: Build native extension
      run: |
        export CARGO_TARGET_DIR="$RUNNER_TEMP/axile-storage-target"
        echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
        cargo build --manifest-path rust/storage/Cargo.toml --release --locked --lib --features python
    - name: Stage and verify native extension
      run: uv run --no-project --with hatchling --with packaging python scripts/build_native_analysis.py --no-build --target-dir "$CARGO_TARGET_DIR"
    - uses: actions/upload-artifact@v4
      with:
        name: axile-native-core-${{ matrix.platform }}
        path: axile/server/_native/_core.*
        if-no-files-found: error

  editor-ui:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: axile-native-core-linux-x86_64
        path: axile/server/_native
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - run: uv sync --locked --group dev
    - run: bun install --frozen-lockfile
      working-directory: ui
    - uses: dtolnay/rust-toolchain@1.99.1
      with:
        targets: wasm32-unknown-unknown
    - name: Cache wasm-bindgen CLI
      id: wasm-bindgen
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/wasm-bindgen-cli
        key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-0.2.130
    - name: Install wasm-bindgen CLI
      if: steps.wasm-bindgen.outputs.cache-hit != 'true'
      run: cargo install wasm-bindgen-cli --version 0.2.130 --locked --root "$RUNNER_TEMP/wasm-bindgen-cli"
    - name: Add wasm-bindgen to PATH
      run: echo "$RUNNER_TEMP/wasm-bindgen-cli/bin" >> "$GITHUB_PATH"
    - name: Cache WASM builds
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          /tmp/axile-replay-heat-*
        key: wasm-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-bindgen-0.2.130-${{ hashFiles('rust/**/Cargo.lock', 'ui/scripts/build-replay-heat.ts') }}-${{ github.sha }}
        restore-keys: |
          wasm-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-bindgen-0.2.130-${{ hashFiles('rust/**/Cargo.lock', 'ui/scripts/build-replay-heat.ts') }}-
    - run: bun run lint && bun run build
      working-directory: ui
    - uses: actions/upload-artifact@v4
      with:
        name: axile-web-ui
        path: axile/server/_static/
        include-hidden-files: true
        if-no-files-found: error
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Sync lint dependencies without the native project
      run: uv sync --locked --only-group dev

    - name: Run Ruff formatter check
      run: |
        uv run --no-sync ruff format --check axile tests
      continue-on-error: false

    - name: Run Ruff lint
      run: |
        uv run --no-sync ruff check axile tests
      continue-on-error: false

    - name: Run Ruff complexity gate
      run: |
        uv run --no-sync ruff check axile/executor/algorithms --select C901
      continue-on-error: false

  type-check:
    needs: native
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: axile-native-core-linux-x86_64
        path: axile/server/_native

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
      continue-on-error: false

    - name: Sync dev dependencies
      run: |
        uv sync --locked --group dev
      continue-on-error: false

    - name: Run BasedPyright
      run: |
        uv run basedpyright

  smoke:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux-x86_64
          container: quay.io/pypa/manylinux_2_28_x86_64@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
        - os: windows-latest
          platform: windows-x86_64
          container: ''
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: axile-native-core-${{ matrix.platform }}
        path: axile/server/_native
    - name: Use manylinux CPython
      if: runner.os == 'Linux'
      shell: bash
      run: echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
    - uses: actions/setup-python@v5
      if: runner.os == 'Windows'
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --locked --group dev
    - name: Check native startup, migrations and public API
      run: python -c "import subprocess; subprocess.run(['uv', 'run', 'pytest', 'tests/contract/test_native_storage_runtime.py', 'tests/unit/packaging/test_release_platforms.py', '-q'], check=True, timeout=60)"
