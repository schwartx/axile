name: Code Quality

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - uses: dtolnay/rust-toolchain@stable
    - name: Build native extension
      run: |
        export CARGO_TARGET_DIR="$RUNNER_TEMP/axile-analysis-target"
        echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
        cargo build --manifest-path rust/analysis/Cargo.toml --release --locked --lib --features python
    - name: Stage and verify native extension
      run: uv run --no-project --with hatchling --with packaging python scripts/build_native_analysis.py --no-build --target-dir "$CARGO_TARGET_DIR"
    - uses: actions/upload-artifact@v4
      with:
        name: axile-native-core
        path: axile/server/_native/_core.abi3.so
        if-no-files-found: error

  editor-ui:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: axile-native-core
        path: axile/server/_native
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - run: uv sync --locked --group dev
    - run: bun install --frozen-lockfile
      working-directory: ui
    - run: bun run lint && bun test && bun run build
      working-directory: ui
    - run: bunx playwright install --with-deps chromium
      working-directory: ui
    - run: bun run test:e2e --max-failures=1
      working-directory: ui
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: editor-browser-traces
        path: ui/test-results/
  lint:
    needs: native
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: axile-native-core
        path: axile/server/_native

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Sync test dependencies
      run: |
        uv sync --locked --group dev --extra ctp

    - name: Run Ruff formatter check
      run: |
        uv run ruff format --check axile tests
      continue-on-error: false

    - name: Run Ruff lint
      run: |
        uv run ruff check axile tests
      continue-on-error: false

    - name: Run Ruff complexity gate
      run: |
        uv run ruff check axile/executor/algorithms --select C901
      continue-on-error: false

  type-check:
    needs: native
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: axile-native-core
        path: axile/server/_native

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
      continue-on-error: false

    - name: Sync dev dependencies
      run: |
        uv sync --locked --group dev
      continue-on-error: false

    - name: Run BasedPyright
      run: |
        uv run basedpyright

  test:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: axile-native-core
        path: axile/server/_native

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Fetch migration baseline
      run: git fetch --depth=1 origin refs/tags/v0.22.0:refs/tags/v0.22.0

    - name: 配置 CTP 所需的中文区域设置
      run: |
        sudo locale-gen zh_CN.GB18030

    - name: Sync test dependencies
      run: |
        uv sync --locked --group dev --extra ctp --extra gm

    - name: 验证 CTP 原生模块
      run: |
        locale -a | grep -qi '^zh_CN.gb18030$'
        uv run python -c "from openctp_ctp import thostmduserapi, thosttraderapi"

    - name: Run tests
      run: |
        # Preserve pytest's status even if a native SDK exits during interpreter shutdown.
        uv run python -c 'import os, sys, pytest; code = pytest.main(sys.argv[1:]); sys.stdout.flush(); sys.stderr.flush(); os._exit(int(code))' tests/ -v \
          --ignore=tests/live \
          --cov=axile --cov-report=xml --cov-report=term-missing --cov-fail-under=69

    - name: Run offline CTP scenario script tests
      run: |
        # Tests block network access and use SDK request substitutes; no broker login.
        uv run python -c 'import os, sys, pytest; code = pytest.main(sys.argv[1:]); sys.stdout.flush(); sys.stderr.flush(); os._exit(int(code))' 飞泰CTP测试/tests -q

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      timeout-minutes: 5
      with:
        use_oidc: true
        fail_ci_if_error: true
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
